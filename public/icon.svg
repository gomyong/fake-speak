<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Boro UI Minimalist App Icon: Polestar-inspired Black & Warm White -->
  <rect width="512" height="512" rx="128" fill="#080909"/>
  
  <!-- Outer Hairline Accent Ring -->
  <circle cx="256" cy="256" r="192" stroke="#E5E2E1" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Iconic Circular Boundary (1.5pt proportional line-weight) -->
  <circle cx="256" cy="256" r="156" stroke="#FCF8F8" stroke-width="14"/>

  <!-- Centered Typographic 'F' with Inter/Architectural Precision -->
  <text 
    x="256" 
    y="262" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FCF8F8" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="192" 
    font-weight="600" 
    letter-spacing="-0.04em"
  >F</text>
</svg>
